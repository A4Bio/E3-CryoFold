name: cryofold
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.9
  - numpy<2.0.0
  - pandas
  - scipy
  - matplotlib
  - pytorch=2.0.1
  - torchvision
  - torchaudio
  - cudatoolkit=11.7
  - scikit-learn
  - pip
  - pip:
    - transformers==4.24.0
    - tqdm
    - jupyterlab
    - einops
    - torch_scatter==2.1.1
    - torch_geometric==2.3.1
    - torch_cluster==1.6.1
    - --find-links https://data.pyg.org/whl/torch-2.0.0+cu117.html   
    - fair-esm
    - mrcfile
    - biopython
prefix: /opt/local/E3-Cryofold/
